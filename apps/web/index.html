<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Document Intelligence" />
    <script>
      (() => {
        try {
          const preference =
            localStorage.getItem('doc-intelligence-theme') || 'system';
          const isDark =
            preference === 'dark' ||
            (preference === 'system' &&
              matchMedia('(prefers-color-scheme: dark)').matches);

          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.dataset.theme = preference;
        } catch {
          // The system theme remains the browser default when storage is unavailable.
        }
      })();
    </script>
    <title>Document Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
